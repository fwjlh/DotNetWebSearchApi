name: .NET 10 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotNetWebSearchApi.sln

      - name: Build
        run: dotnet build DotNetWebSearchApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DotNetWebSearchApi.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
